version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gestorgastos_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=BaseDeDatosSegura12!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: GestorGastos.API/Dockerfile
    container_name: gestorgastos_api
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__AppConnection=Server=db,1433;Database=DB_Sistema_Gastos;User Id=sa;Password=BaseDeDatosSegura12!;Encrypt=True;TrustServerCertificate=True;
      - JwtSettings__SecretKey=TuClaveSuperSecretaYMuyLargaQueNadieAdivinaraNunca123456789!

volumes:
  sqlserver_data: