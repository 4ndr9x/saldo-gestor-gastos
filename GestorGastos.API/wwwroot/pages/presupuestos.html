<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saldo — Presupuestos</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/estiloLogin.css">
  <link rel="stylesheet" href="../css/estiloDashboard.css">
  <link rel="stylesheet" href="../css/estiloPresupuestos.css">

  <script>
    // Guard inmediato (ver dashboard.html para la explicación completa).
    (function guardInmediato(){
      const token = localStorage.getItem('gestor_gastos_token') || sessionStorage.getItem('gestor_gastos_token');
      if(!token){
        window.location.replace('../pages/login.html');
      }
    })();
  </script>
</head>
<body>

<div class="app-shell">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div>
      <div class="brand-mark">
        <div class="glyph">S</div>
        <span>Saldo</span>
      </div>

      <ul class="nav-list" style="margin-top:28px;">
        <li><a href="dashboard.html">Resumen</a></li>
        <li><a href="gastos.html">Gastos</a></li>
        <li><a href="catalogos.html">Catálogos</a></li>
        <li><a href="reportes.html">Reportes</a></li>
        <li><a href="presupuestos.html" class="active">Presupuestos</a></li>
        <li><a href="importacion.html">Importar</a></li>
      </ul>
    </div>

    <div class="sidebar-foot sidebar-foot-acciones">
      <a href="perfil.html" class="logout-btn">Mi Cuenta</a>
      <button class="logout-btn" id="btnLogout">Cerrar sesión</button>
    </div>
  </aside>

  <!-- ============ CONTENIDO PRINCIPAL ============ -->
  <main class="main">

    <div class="main-header">
      <div>
        <h1>Presupuestos</h1>
        <p class="fecha">Define un tope de gasto por categoría y sigue tu consumo mes a mes.</p>
      </div>
    </div>

    <!-- ---------- Controles: mes + agregar (mismo patrón que Reportes) ---------- -->
    <section class="presupuestos-controles">
      <div class="field field-mes">
        <label for="filtroMonthYear">Mes</label>
        <input type="month" id="filtroMonthYear">
      </div>

      <button id="btnAbrirModal" class="btn-primary">
        <span class="btn-label">+ Agregar Presupuesto</span>
      </button>
    </section>

    <div id="presupuestosBanner" class="banner"></div>

    <div id="alertaExcedidos" class="banner banner-alerta-excedidos" style="display:none;"></div>

    <!-- ---------- Grid de tarjetas ---------- -->
    <section class="section-card">
      <div id="listaPresupuestos" class="grid-presupuestos">
        <div class="estado-vacio">Cargando...</div>
      </div>
    </section>

  </main>
</div>

<!-- ============ MODAL: AGREGAR / EDITAR PRESUPUESTO ============ -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal-card">
    <h2 id="modalTitulo">Agregar presupuesto</h2>

    <div id="modalBanner" class="banner"></div>

    <form id="formPresupuesto" class="active" novalidate>
      <input type="hidden" id="presupuestoId" value="">

      <div class="field" style="margin-bottom:14px;">
        <label for="presupuestoCategoria">Categoría</label>
        <select id="presupuestoCategoria" required>
          <option value="">Cargando categorías...</option>
        </select>
        <span class="field-error" id="errPresupuestoCategoria"></span>
      </div>

      <div class="field" style="margin-bottom:14px;">
        <label for="presupuestoMonto">Monto máximo</label>
        <input type="number" id="presupuestoMonto" min="0.01" step="0.01" placeholder="0.00" required>
        <span class="field-error" id="errPresupuestoMonto"></span>
      </div>

      <div class="field" style="margin-bottom:20px;">
        <label for="presupuestoMonthYear">Mes y año</label>
        <input type="month" id="presupuestoMonthYear" required>
        <span class="field-error" id="errPresupuestoMonthYear"></span>
      </div>

      <div class="modal-actions">
        <button type="button" id="btnCancelarModal" class="btn-secondary">Cancelar</button>
        <button type="submit" id="btnGuardarPresupuesto" class="btn-primary">
          <span class="spinner"></span>
          <span class="btn-label">Guardar</span>
        </button>
      </div>
    </form>
  </div>
</div>

<script src="../js/scriptComun.js"></script>
<script src="../js/scriptPresupuestos.js"></script>
</body>
</html>
